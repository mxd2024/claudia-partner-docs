<figure class="conn" aria-labelledby="cn-cap"><figcaption id="cn-cap"><b>Chat Note のつながり</b>（URL と利用できるカテゴリは、環境ごとに異なります）</figcaption><section class="conn-lane" aria-label="A. 社員の利用"><h3>A. 社員の利用</h3><p class="conn-lead">PC ではアプリの画面に埋め込んで使い、スマートフォンでは Chat Note を直接開いて使います。</p><div class="conn-flow"><div class="conn-node"><b>社員のブラウザー</b><span>PC・スマートフォン</span></div><div class="conn-link"><span>Claudia Partner のサインイン</span></div><div class="conn-node core"><b>Chat Note</b><span>スレッド・チャット・ノート</span></div></div></section><section class="conn-lane" aria-label="B. アプリのサーバーからの利用"><h3>B. アプリのサーバーからの利用</h3><p class="conn-lead">アプリのサーバーが、社員のアクセストークンを付けて、その社員として読み書きします。</p><div class="conn-flow"><div class="conn-node"><b>アプリのサーバー（BFF）</b><span>同じサーバーの中から</span></div><div class="conn-link"><span>社員のアクセストークン</span></div><div class="conn-node core"><b>Chat Note の API</b><span>カテゴリ・スレッド・ノート</span></div></div></section><section class="conn-lane" aria-label="C. 基盤からの取り込み"><h3>C. 基盤からの取り込み</h3><p class="conn-lead">閲覧権限は、基盤の役割とケースの担当者から設定されます。</p><div class="conn-flow"><div class="conn-node"><b>Claudia Partner の基盤</b><span>役割・ケースの担当</span></div><div class="conn-link"><span>1日1回の取り込みとサインイン時</span></div><div class="conn-node core"><b>Chat Note のカテゴリ</b><span>部署のカテゴリ・ケースのカテゴリ</span></div></div></section></figure>
