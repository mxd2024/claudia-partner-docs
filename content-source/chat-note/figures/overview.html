<figure class="conn" aria-labelledby="cn-cap"><figcaption id="cn-cap"><b>Chat Note のつながり</b>（住所や使える場所は、利用環境ごとに異なります）</figcaption><section class="conn-lane" aria-label="A. 社員が使う"><h3>A. 社員が使う</h3><p class="conn-lead">PC ではアプリの画面にはめ込んで、スマホでは Chat Note を直接開いて使います。</p><div class="conn-flow"><div class="conn-node"><b>社員のブラウザー</b><span>PC・スマホ</span></div><div class="conn-link"><span>Claudia Partner のサインイン</span></div><div class="conn-node core"><b>Chat Note</b><span>スレッド・チャット・ノート</span></div></div></section><section class="conn-lane" aria-label="B. アプリのサーバーから使う"><h3>B. アプリのサーバーから使う</h3><p class="conn-lead">アプリのサーバーが、社員のアクセストークンを付けて、その社員として読み書きします。</p><div class="conn-flow"><div class="conn-node"><b>アプリのサーバー（BFF）</b><span>同じサーバーの中から</span></div><div class="conn-link"><span>社員のアクセストークン</span></div><div class="conn-node core"><b>Chat Note の API</b><span>場所・スレッド・ノート</span></div></div></section><section class="conn-lane" aria-label="C. 基盤から写す"><h3>C. 基盤から写す</h3><p class="conn-lead">見られる場所は、基盤の役割とケースの担当から決まります。</p><div class="conn-flow"><div class="conn-node"><b>Claudia Partner の基盤</b><span>役割・ケースの担当</span></div><div class="conn-link"><span>1日1回の写しとサインインのとき</span></div><div class="conn-node core"><b>Chat Note の場所</b><span>部署の場所・ケースの場所</span></div></div></section></figure>
