<figure class="conn" aria-labelledby="conn-cap"><figcaption id="conn-cap"><b>想定する接続構成</b>（接続先・資格・利用できる表は、環境ごとに異なります）</figcaption><section class="conn-lane" aria-label="A. 人が使うアプリ（本人のログイン）"><h3>A. 人が使うアプリ（本人のログイン）</h3><p class="conn-lead">利用者がブラウザーで使うアプリです。ログインとトークンの保持は、アプリのサーバー側で行います。</p><div class="conn-flow"><div class="conn-node"><b>利用者のブラウザー</b><span>画面を操作する</span></div><div class="conn-link"><span>画面操作</span></div><div class="conn-node"><b>アプリのサーバー側（BFF）</b><span>トークンを保持する</span></div><div class="conn-link"><span>トークンを付けて呼び出す</span></div><div class="conn-node core"><b>基盤API</b><span>表・権限・アプリ・画像のAPI</span></div></div><p class="conn-note">ログインは認証サービスで行います。アプリのサーバー側が利用者を認証サービスへ案内し（OIDC Authorization Code + PKCE、MFA）、返された認可コードをトークンに交換します。詳しくは<a href="authentication.html">本人として接続する</a>。</p></section><section class="conn-lane" aria-label="B. サーバー処理（service接続）"><h3>B. サーバー処理（service接続）</h3><p class="conn-lead">バッチや連携など、人の操作を介さない処理です。管理者の承認を受けたserviceとして接続します。</p><div class="conn-flow"><div class="conn-node"><b>あなたのサーバー処理</b><span>登録した鍵を持つ</span></div><div class="conn-link"><span>トークンを付けて呼び出す</span></div><div class="conn-node core"><b>基盤API</b><span>承認された表・操作・期限だけ</span></div></div><p class="conn-note">トークンは、登録した鍵で署名した要求を、認証サービスに送って取得します。serviceは、人向けのAPI（<code>GET /v1/me</code>など）を使えません。詳しくは<a href="service-access.html">serviceとして接続する</a>。</p></section><section class="conn-lane" aria-label="C. AIエージェント（MCP）"><h3>C. AIエージェント（MCP）</h3><p class="conn-lead">AIエージェントから、取込の操作を行います。現在のMCPは、取込用の8ツールです。</p><div class="conn-flow"><div class="conn-node"><b>AIエージェント</b><span>MCPホスト</span></div><div class="conn-link"><span>MCP</span></div><div class="conn-node"><b>MCPアダプター</b><span>手元のPCで実行する</span></div><div class="conn-link"><span>HTTPS・接続キー</span></div><div class="conn-node"><b>管理サイト</b><span>取込のAPI</span></div><div class="conn-link"><span>構成ごとの資格で</span></div><div class="conn-node core"><b>基盤API</b><span>権限を判断する</span></div></div><p class="conn-note">MCPアダプターの接続先は、基盤APIのURLではなく、管理サイトのHTTPS originです。取込は、利用環境の構成に応じた人セッションまたはservice資格で、基盤APIを通ります。管理サイトの接続キーを、そのまま基盤APIには送りません。全APIサービスへの対応は準備中です。導入は<a href="mcp.html">MCPの導入</a>。</p></section><p class="conn-foot">基盤APIは、リクエストごとに、その時点の権限（本人はMFAを含む。serviceは承認の範囲）を確認します。</p></figure>
